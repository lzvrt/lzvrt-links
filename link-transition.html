<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#242321">
  <title>Entering…</title>
  <style>
    :root { color-scheme: dark; --bg: #242321; --accent: #9491d4; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #08070a; }
    body { display: grid; place-items: center; background: var(--bg); animation: appear .24s ease-out both; }
    .launch { display: grid; place-items: center; width: 128px; aspect-ratio: 1; border: 1px solid rgba(205,202,250,.62); border-radius: 50%; color: #f5f4ff; background: radial-gradient(circle,rgba(148,145,212,.32),rgba(148,145,212,.12) 60%,rgba(148,145,212,.06)); box-shadow: 0 0 0 9px rgba(148,145,212,.04),0 0 38px rgba(148,145,212,.2); transform-origin: center; animation: launch 1.46s cubic-bezier(.28,.7,.2,1) both; }
    .launch svg { width: 52px; height: 52px; fill: currentColor; animation: icon-fade 1.46s ease-in both; }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    @keyframes launch { 0% { opacity: 0; transform: translateY(32px) scale(.72); } 11% { opacity: 1; transform: translateY(-20px) scale(1.1); } 22% { transform: translateY(0) scale(1); } 31% { transform: translateY(-6px) scale(1.035); } 40% { transform: translateY(0) scale(1); } 100% { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 80px rgba(148,145,212,.42); transform: scale(48); } }
    @keyframes icon-fade { 0%, 27% { opacity: 1; } 43%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .launch, .launch svg { animation-duration: .15s; } }
  </style>
</head>
<body>
  <main class="launch" id="launch" aria-hidden="true"></main>
  <script>
    const destination = new URLSearchParams(location.search).get('to');
    let target;
    try { target = new URL(destination); } catch { target = null; }
    const allowed = target && target.protocol === 'https:' && ['steamcommunity.com', 't.me', 'discordapp.com'].includes(target.hostname);
    if (!allowed) {
      document.body.innerHTML = '<p style="font:15px system-ui;color:#e9e7e5">Invalid destination.</p>';
    } else {
      const icons = {
        'steamcommunity.com': '<path d="M12.37 2.4a9.6 9.6 0 0 0-9.48 8.1l5.16 2.13a2.63 2.63 0 0 1 1.5-.47c.11 0 .23 0 .34.02l2.3-3.34v-.05a3.5 3.5 0 1 1 3.5 3.5h-.08l-3.3 2.35c0 .08.01.17.01.25a2.64 2.64 0 0 1-5.2.65l-3.7-1.53a9.6 9.6 0 1 0 8.95-11.6Zm3.33 8.15a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2ZM9.9 17.8a1.58 1.58 0 1 0 0-3.16 1.58 1.58 0 0 0 0 3.16Z"/>',
        't.me': '<path d="m21.4 4.1-3.2 15.1c-.24 1.07-.87 1.33-1.76.83l-4.88-3.6-2.35 2.26c-.26.26-.48.48-.98.48l.35-4.97 9.04-8.17c.4-.35-.09-.55-.62-.2L5.83 12.95.99 11.43c-1.05-.33-1.07-1.05.22-1.56L20.1 2.5c.88-.32 1.65.21 1.3 1.6Z"/>',
        'discordapp.com': '<path d="M19.7 5.1A18.4 18.4 0 0 0 15.2 3l-.6 1.2a16.8 16.8 0 0 0-5.2 0L8.8 3a18.4 18.4 0 0 0-4.5 2.1C1.5 9.3.7 13.4 1.1 17.5a18.3 18.3 0 0 0 5.5 2.8l1.2-2a11.7 11.7 0 0 1-1.9-.9l.5-.4a13.1 13.1 0 0 0 11.2 0l.5.4a11.7 11.7 0 0 1-1.9.9l1.2 2a18.3 18.3 0 0 0 5.5-2.8c.5-4.7-.8-8.8-3.2-12.4ZM8.5 14.9c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 .9 2 2.2-.9 2.2-2 2.2Zm7 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 .9 2 2.2-.9 2.2-2 2.2Z"/>'
      };
      document.querySelector('#launch').innerHTML = `<svg viewBox="0 0 24 24">${icons[target.hostname]}</svg>`;
      window.setTimeout(() => location.replace(target.href), matchMedia('(prefers-reduced-motion: reduce)').matches ? 180 : 1500);
    }
  </script>
</body>
</html>
